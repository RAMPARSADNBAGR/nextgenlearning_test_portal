<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body class="no-select">

<div id="studentNameTag" class="student-name-tag"></div>

<div class="container quiz-container" id="quizContainer">

<div class="quiz-header">

<h2 id="timer">60:00</h2>

<div id="progress"></div>

</div>

<div class="quiz-layout">

<div class="card quiz-card">

<h2 id="question"></h2>

<div id="options"></div>

<div class="quiz-actions">

<div class="quiz-actions-row">

<button id="prevBtn" class="btn-outline">Previous</button>

<button id="nextBtn" class="btn-outline">Next</button>

</div>

<div class="quiz-actions-row">

<button id="markReviewBtn" class="btn-secondary">Mark for Review</button>

<button id="submitBtn" class="btn-submit">Submit Test</button>

</div>

</div>

</div>

<div class="nav-panel">

<h3>Question Navigator</h3>

<div id="navigator" class="navigator-grid"></div>

<div id="navSummary" class="nav-summary"></div>

</div>

</div>

</div>

<script src="../data/config.js"></script>

<script src="../data/chapters.generated.js"></script>

<script src="../js/chapter-utils.js"></script>

<script src="../js/anticheat.js"></script>

<script src="../js/quiz-loader.js"></script>

</body>

</html>
